name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Lint Python
        run: python -m ruff check app.py matchlog tests tools
      - name: Check formatting of maintenance entry points
        run: python -m ruff format --check tools/test.py tools/build_changelog.py tools/verify_desktop.py tools/verify_real_images.py
      - name: Check annotated Python boundaries
        run: python -m mypy
      - name: Check JavaScript syntax
        run: |
          Get-ChildItem ui -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run Python tests
        run: python -B tools/test.py
      - name: Run JavaScript tests
        run: node --test tests/*.cjs
